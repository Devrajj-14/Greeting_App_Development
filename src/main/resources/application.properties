spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Change 'localhost' to 'greeting_mysql' so Docker knows where to route the traffic
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://greeting_mysql:3306/greeting_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Fool@123#}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
server.port=9090
